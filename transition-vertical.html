<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Guta Flores — Transición Vertical 9:16 (Stinger)</title>
  <link rel="stylesheet" href="transition-vertical.css">
</head>
<body>

  <div class="transition-overlay">

    <!-- Franjas de barrido vertical (de arriba hacia abajo) -->
    <div class="stripe s1"></div>
    <div class="stripe s2"></div>
    <div class="stripe s3"></div>
    <div class="stripe s4"></div>
    <div class="stripe s5"></div>
    <div class="stripe s6"></div>
    <div class="stripe s7"></div>
    <div class="stripe s8"></div>
    <div class="stripe s9"></div>

    <!-- Textura de líneas -->
    <div class="poncho-texture"></div>
    <div class="golden-line"></div>

    <!-- Ornamentos de esquina -->
    <div class="corner corner-tl">
      <svg viewBox="0 0 70 70"><path d="M4 66 L4 4 L66 4"/><path d="M4 20 L20 4"/><path d="M4 36 L36 4"/></svg>
    </div>
    <div class="corner corner-tr">
      <svg viewBox="0 0 70 70"><path d="M4 66 L4 4 L66 4"/><path d="M4 20 L20 4"/><path d="M4 36 L36 4"/></svg>
    </div>
    <div class="corner corner-bl">
      <svg viewBox="0 0 70 70"><path d="M4 66 L4 4 L66 4"/><path d="M4 20 L20 4"/><path d="M4 36 L36 4"/></svg>
    </div>
    <div class="corner corner-br">
      <svg viewBox="0 0 70 70"><path d="M4 66 L4 4 L66 4"/><path d="M4 20 L20 4"/><path d="M4 36 L36 4"/></svg>
    </div>

    <!-- Partículas de luz -->
    <div class="sparkle sp1"></div>
    <div class="sparkle sp2"></div>
    <div class="sparkle sp3"></div>
    <div class="sparkle sp4"></div>
    <div class="sparkle sp5"></div>
    <div class="sparkle sp6"></div>

    <!-- Líneas decorativas alrededor del logo -->
    <div class="deco-lines">
      <div class="deco-line-top"></div>
      <div class="deco-line-bottom"></div>
    </div>

    <!-- Logo Central -->
    <div class="center-logo">
      <div class="logo-brand" data-bind="host-name">GUTA FLORES</div>
      <div class="logo-divider"></div>
      <div class="logo-sub">🎙️ EN VIVO 🎙️</div>
      <div class="logo-tagline">
        <span style="color:#00E6C8; font-weight:800;" data-bind="motto-phrase1">DIFUNDIENDO ARTISTAS POCOS CONOCIDOS</span>
        <span style="color:#FF375F; margin:0 8px;" data-bind="motto-connector">◆ Y ◆</span>
        <span style="color:#FFF; font-weight:800;" data-bind="motto-phrase2">GUITARREAMOS A LA GORRA 🪕</span>
      </div>
    </div>

  </div>

  <script src="script-overlay.js"></script>
</body>
</html>
