<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación Digital — Entrevista Musical</title>
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="overlay-invitacion.css">
  <!-- Library for PNG Export -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>

<body>

  <div class="app-container">
    <!-- PANEL DE EDICIÓN LATERAL -->
    <div class="controls-sidebar">
      <div class="controls-title">
        <span>✉️ Editor de Invitación</span>
      </div>

      <div class="form-group">
        <label for="showTitleInput">Título del Programa</label>
        <input type="text" id="showTitleInput" value="SESIONES RG" placeholder="Ej. SESIONES RG">
      </div>

      <div class="form-group">
        <label for="showSloganInput">Slogan / Temática del Programa</label>
        <input type="text" id="showSloganInput" value="En Vivo: Entrevistas en vivo y zapadas con invitados."
          placeholder="Ej. En Vivo: Entrevistas en vivo...">
      </div>

      <div class="form-group">
        <label for="artistInput">Nombre del Artista / Banda</label>
        <input type="text" id="artistInput" value="[Nombre del artista]" placeholder="Ej. Gustavo Cerati">
      </div>

      <div class="form-group">
        <label>Tipo de Invitación</label>
        <div class="toggle-buttons">
          <button type="button" class="btn-toggle active" id="btnGroup" onclick="setArtistType('group')">
            👥 Grupo / Banda (Plural)
          </button>
          <button type="button" class="btn-toggle" id="btnSolo" onclick="setArtistType('solo')">
            🧑‍🎤 Solista (Singular)
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="hostInput">Firma del Anfitrión</label>
        <input type="text" id="hostInput" value="GUTA FLORES" placeholder="Tu nombre">
      </div>

      <div class="form-group">
        <label for="bodyInput">Mensaje de Invitación</label>
        <textarea id="bodyInput" rows="11" style="resize: vertical;"></textarea>
      </div>

      <button class="btn-action" onclick="downloadImage()">
        <span>📸 Descargar como Imagen (PNG)</span>
      </button>

      <button class="btn-action btn-secondary" onclick="copyText()">
        <span>📋 Copiar Texto del Mensaje</span>
      </button>
    </div>

    <!-- ÁREA DE PREVISUALIZACIÓN / OVERLAY DIGITAL -->
    <div class="preview-area">
      <div class="invitation-card" id="invitationCard">
        <div class="card-brand-header">
          <div class="card-header-badge">
            <span class="badge-dot"></span>
            <span id="displayShowTitleBadge" class="brand-title-text">SESIONES RG</span>
            <span class="badge-sep">◆</span>
            <span class="badge-tag-text">Invitación Especial</span>
          </div>
          <div class="card-slogan-line" id="displayShowSlogan">
            En Vivo: Entrevistas en vivo y zapadas con invitados.
          </div>
        </div>

        <div class="invitation-body" id="invitationContent"></div>

        <div class="invitation-footer">
          <div class="signature-block">
            <span class="sign-valediction">Un abrazo,</span>
            <span class="sign-name" id="displayHostName">GUTA FLORES</span>
          </div>

          <div class="brand-stamp">
            <div class="brand-tag" id="displayFooterShowTitle">SESIONES RG</div>
            <div class="brand-sub">Transmisión & Difusión Musical</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function getTemplateGroup(showTitle, showSlogan, hostName) {
      return `Hola [Nombre del artista], ¿cómo están?.

Soy ${hostName || 'Gustavo "Guta" Flores'}, cantor, guitarrero y conductor del programa "${showTitle || 'SESIONES RG'}".

Les escribo porque sigo de cerca su trabajo musical y me gustaría invitarlos a ser parte de una entrevista especial que estamos realizando sobre música y trayectoria. 

La idea es tener una charla amena sobre sus inicios, el camino recorrido y compartir su experiencia con artistas emergentes que están buscando su propio espacio.

La grabación la realizamos de forma remota (vía vdo.ninja) o si lo prefieren en vivo en nuestro stream principal de los domingos que arranca a las 12:00 hs. (y no tomaría más de 15 a 20 minutos). Luego, los fragmentos destacados se compartirán en nuestras RRSS y nuestra web https://guta.meapp.com.ar para darle visibilidad a su proyecto y conectar con nueva audiencia.

Avisenme si les interesa la propuesta y coordinamos el día y horario que mejor les quede. ¡Sería un verdadero gusto contar con ustedes!`;
    }

    function getTemplateSolo(showTitle, showSlogan, hostName) {
      return `Hola [Nombre del artista], ¿cómo estás?.

Soy ${hostName || 'Gustavo "Guta" Flores'}, cantor, guitarrero y conductor del programa "${showTitle || 'SESIONES RG'}".

Te escribo porque sigo de cerca tu trabajo musical y me gustaría invitarte a ser parte de una entrevista especial que estamos realizando sobre música y trayectoria. 

La idea es tener una charla amena sobre tus inicios, el camino recorrido y compartir tu experiencia con artistas emergentes que están buscando su propio espacio.

La grabación la realizamos de forma remota (vía vdo.ninja) o si lo prefieres en vivo en nuestro stream principal de los domingos que arranca a las 12:00 hs. (y no tomaría más de 15 a 20 minutos). Luego, los fragmentos destacados se compartirán en nuestras RRSS y nuestra web https://guta.meapp.com.ar para darle visibilidad a tu proyecto y conectar con nueva audiencia.

Avisame si te interesa la propuesta y coordinamos el día y horario que mejor te quede. ¡Sería un verdadero gusto contar con vos!`;
    }

    let currentType = 'group';

    const showTitleInput = document.getElementById('showTitleInput');
    const showSloganInput = document.getElementById('showSloganInput');
    const bodyInput = document.getElementById('bodyInput');
    const artistInput = document.getElementById('artistInput');
    const hostInput = document.getElementById('hostInput');
    const invitationContent = document.getElementById('invitationContent');
    const displayHostName = document.getElementById('displayHostName');
    const displayShowTitleBadge = document.getElementById('displayShowTitleBadge');
    const displayShowSlogan = document.getElementById('displayShowSlogan');
    const displayFooterShowTitle = document.getElementById('displayFooterShowTitle');
    const btnGroup = document.getElementById('btnGroup');
    const btnSolo = document.getElementById('btnSolo');

    function resetTemplate(forceUpdateText = false) {
      const showTitle = showTitleInput.value.trim() || 'SESIONES RG';
      const showSlogan = "Entrevistas en vivo.";
      const hostName = hostInput.value.trim() || 'Guta Flores';

      if (currentType === 'group') {
        btnGroup.classList.add('active');
        btnSolo.classList.remove('active');
        if (forceUpdateText || !bodyInput.value) {
          bodyInput.value = getTemplateGroup(showTitle, showSlogan, hostName);
        }
      } else {
        btnSolo.classList.add('active');
        btnGroup.classList.remove('active');
        if (forceUpdateText || !bodyInput.value) {
          bodyInput.value = getTemplateSolo(showTitle, showSlogan, hostName);
        }
      }
      renderCard();
    }

    function setArtistType(type) {
      currentType = type;
      resetTemplate(true);
    }

    function renderCard() {
      const artistName = artistInput.value.trim() || '[Nombre del artista]';
      const hostName = hostInput.value.trim() || 'GUTA FLORES';
      const showTitle = showTitleInput.value.trim() || 'SESIONES RG';
      const showSlogan = "Entrevistas en vivo";

      displayHostName.textContent = hostName;
      displayShowTitleBadge.textContent = showTitle;
      displayShowSlogan.textContent = showSlogan;
      displayFooterShowTitle.textContent = showTitle;

      let formattedText = bodyInput.value;

      // Resaltar nombre de artista con espaciado natural
      formattedText = formattedText.replace(/Hola\s+([^,]+?)\s*,/i, function (match, p1) {
        return `Hola <strong class="artist-highlight">${artistName}</strong>,`;
      });

      // Resaltar nombre del programa si aparece entre comillas
      function escapeRegExp(string) {
        return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      }
      if (showTitle) {
        try {
          const reg = new RegExp(`"${escapeRegExp(showTitle)}"`, 'gi');
          formattedText = formattedText.replace(reg, `"<strong class="show-highlight">${showTitle}</strong>"`);
        } catch (e) { }
      }

      invitationContent.innerHTML = formattedText;
    }

    showTitleInput.addEventListener('input', () => {
      renderCard();
    });
    showSloganInput.addEventListener('input', () => {
      renderCard();
    });
    artistInput.addEventListener('input', renderCard);
    hostInput.addEventListener('input', renderCard);
    bodyInput.addEventListener('input', renderCard);

    // Cargar valores iniciales desde localStorage o stream-data.json
    async function loadData() {
      let data = null;
      try {
        const localStr = localStorage.getItem('streamData');
        if (localStr) data = JSON.parse(localStr);
      } catch (e) { }

      if (!data) {
        try {
          const res = await fetch('stream-data.json?t=' + Date.now());
          if (res.ok) data = await res.json();
        } catch (e) { }
      }

      if (data) {
        if (data.show && data.show.title) {
          showTitleInput.value = data.show.title;
        }
        if (data.show && data.show.slogan) {
          showSloganInput.value = data.show.slogan;
        }
        if (data.guest && data.guest.name && data.guest.name.trim() !== '') {
          artistInput.value = data.guest.name;
        } else if (data.guest1 && data.guest1.name && data.guest1.name.trim() !== '') {
          artistInput.value = data.guest1.name;
        }
        if (data.host && data.host.name && data.host.name.trim() !== '') {
          hostInput.value = data.host.name;
        }
      }

      resetTemplate(true);
    }

    loadData();

    window.addEventListener('storage', function (e) {
      if (e.key === 'streamData' && e.newValue) {
        try {
          const data = JSON.parse(e.newValue);
          if (data.show && data.show.title) showTitleInput.value = data.show.title;
          if (data.show && data.show.slogan) showSloganInput.value = data.show.slogan;
          if (data.guest && data.guest.name) artistInput.value = data.guest.name;
          if (data.host && data.host.name) hostInput.value = data.host.name;
          renderCard();
        } catch (err) { }
      }
    });

    function downloadImage() {
      const card = document.getElementById('invitationCard');
      html2canvas(card, {
        backgroundColor: '#0d0d0d',
        scale: 2,
        useCORS: true
      }).then(canvas => {
        const link = document.createElement('a');
        const artist = artistInput.value.replace(/[^a-z0-9]/gi, '_').toLowerCase() || 'artista';
        link.download = `Invitacion_${showTitleInput.value.replace(/[^a-z0-9]/gi, '_')}_${artist}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    function copyText() {
      const textToCopy = `${bodyInput.value}\n\nUn abrazo,\n${hostInput.value}\n${showTitleInput.value}`;
      navigator.clipboard.writeText(textToCopy).then(() => {
        alert('¡Texto de la invitación copiado al portapapeles!');
      });
    }
  </script>
</body>

</html>
