<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="likes.css">
    <title>Likes</title>
</head>

<body>
    <div class="tap-container">
        <!-- Punto de impacto y corazones -->
        <div class="hearts-burst">
            <span class="heart h-1">♥</span>
            <span class="heart h-2">♥</span>
            <span class="heart h-3">♥</span>
            <span class="heart h-4">♥</span>
            <span class="heart h-5">♥</span>
            <span class="heart h-6">♥</span>
            <span class="heart h-7">♥</span>
            <span class="heart h-8">♥</span>
        </div>

        <!-- Contorno de mano/dedo haciendo tap (SVG Transparente) -->
        <div class="hand-wrapper">
            <svg class="hand-icon" viewBox="0 0 100 120" fill="none" stroke="#ffffff" stroke-width="3.5"
                stroke-linecap="round" stroke-linejoin="round">
                <!-- Dedo índice apuntando y contorno de mano -->
                <path
                    d="M45 12 C 39 12 39 22 39 28 L 39 58 C 35 55 29 57 27 61 C 25 65 27 69 31 73 L 42 88 C 48 98 58 102 70 102 L 78 102 C 88 102 92 94 92 84 L 92 52 C 92 46 86 42 80 42 C 77 42 74 44 72 46 C 70 42 64 40 60 40 C 57 40 54 42 52 44 L 52 28 C 52 12 48 12 45 12 Z" />
            </svg>
        </div>
    </div>
</body>

</html>
