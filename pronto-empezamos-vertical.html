<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, initial-scale=1.0">
  <title>Guta Flores — Pronto Empezamos Vertical 9:16</title>
  <link rel="stylesheet" href="pronto-empezamos-vertical.css">
</head>
<body>

  <!-- Fondos GPU -->
  <div class="bg"></div>
  <div class="bg-glow"></div>
  <div class="dots-overlay"></div>
  <div class="poncho-band poncho-band-top"></div>
  <div class="poncho-band poncho-band-bottom"></div>

  <!-- Anillos concéntricos de energía -->
  <div class="rings-wrap">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
  </div>

  <!-- Ornamentos esquinas -->
  <div class="corner-orn c-tl">
    <svg viewBox="0 0 65 65"><path d="M4 61 L4 4 L61 4"/><path d="M4 22 L22 4"/><path d="M4 40 L40 4"/></svg>
  </div>
  <div class="corner-orn c-tr">
    <svg viewBox="0 0 65 65"><path d="M4 61 L4 4 L61 4"/><path d="M4 22 L22 4"/><path d="M4 40 L40 4"/></svg>
  </div>
  <div class="corner-orn c-bl">
    <svg viewBox="0 0 65 65"><path d="M4 61 L4 4 L61 4"/><path d="M4 22 L22 4"/><path d="M4 40 L40 4"/></svg>
  </div>
  <div class="corner-orn c-br">
    <svg viewBox="0 0 65 65"><path d="M4 61 L4 4 L61 4"/><path d="M4 22 L22 4"/><path d="M4 40 L40 4"/></svg>
  </div>

  <!-- Contenedor central vertical (1080x1920) -->
  <div class="center-vertical">

    <!-- Badge En Breve -->
    <div class="live-badge">
      <div class="live-dot"></div>
      <span class="live-badge-text">🎬 Preparando transmisión</span>
    </div>

    <!-- Isotipo Oficial Sesiones RG con animación de vúmetro y subwoofer -->
    <div class="vumeter-hero">
      <div class="vumeter-shockwave"></div>
      <div class="vumeter-shockwave shockwave-2"></div>
      <div class="vumeter-shockwave shockwave-3"></div>
      <img src="branding/Image_4.png" alt="Sesiones RG" class="vumeter-img">
    </div>

    <!-- Título y Conductor -->
    <div class="show-title-tag" data-bind="show-title">SESIONES RG</div>
    <div class="channel-name" data-bind="host-name">GUTA FLORES</div>

    <div class="gold-line"></div>

    <!-- Mensaje Principal -->
    <div class="main-msg">PRONTO EMPEZAMOS</div>

    <!-- Subtítulo -->
    <div class="sub-msg">¡Preparate que arrancamos enseguida! 🎙️</div>

    <!-- Motto Banner Vertical -->
    <div class="motto-banner" data-bind="motto-banner">
      <div class="motto-text-group">
        <span class="motto-phrase highlight" data-bind="motto-phrase1">🎙️ DIFUNDIENDO ARTISTAS POCOS CONOCIDOS</span>
        <span class="motto-connector" data-bind="motto-connector">Y</span>
        <span class="motto-phrase" data-bind="motto-phrase2">GUITARREAMOS A LA GORRA 🪕</span>
      </div>
    </div>

    <!-- Barra de Carga -->
    <div class="progress-wrap">
      <span class="progress-label">Cargando transmisión</span>
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
    </div>

    <!-- Tarjetas de Info en Grid 2x2 para Vertical -->
    <div class="show-info-vertical">
      <div class="info-card">
        <div class="label">🎙️ Conductor</div>
        <div class="value" data-bind="host-name">Guta Flores</div>
      </div>
      <div class="info-card" data-bind="cohost-box" style="display:none;">
        <div class="label" data-bind="cohost-role">🎙️ Co-Host</div>
        <div class="value" data-bind="cohost-name"></div>
      </div>
      <div class="info-card" data-bind="guest-box" style="display:none;">
        <div class="label">💬 Invitado</div>
        <div class="value gold" data-bind="guest-name"></div>
      </div>
      <div class="info-card">
        <div class="label">📱 Plataforma</div>
        <div class="value">TikTok Live</div>
      </div>
    </div>

  </div>

  <script src="script-overlay.js"></script>
</body>
</html>
