<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Guta Flores — Fondo Animado</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    /* ============================================================
       FONDO ANIMADO — cubre todo el viewport
       Usar como capa BASE en OBS (debajo de los otros overlays)
       ============================================================ */
    .bg-layer {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg,
          #8B0000 0%, #C0392B 15%, #1A1A1A 25%,
          #1A1A1A 30%, #8B0000 40%, #C0392B 55%,
          #1A1A1A 65%, #1A1A1A 70%, #8B0000 85%, #C0392B 100%);
      background-size: 300% 300%;
      animation: ponchoWave 8s ease infinite;
    }

    @keyframes ponchoWave {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>

<body>
  <div class="bg-layer"></div>
</body>

</html>
