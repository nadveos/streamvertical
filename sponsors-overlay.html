<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auspiciantes - Overlay</title>
  <style>
    :root {
      --coral: #FF375F;
      --turquoise: #00E6C8;
      --purple: #6C5CE7;
      --gold: #FFD700;
      --bg-dark: rgba(16, 18, 26, 0.85);
      --border-glow: rgba(0, 230, 200, 0.4);
    }
    
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .sponsors-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: var(--bg-dark);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: min(4vw, 4vh);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8), inset 0 0 10px var(--border-glow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
    }

    .sponsors-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 1.5vh;
      background: linear-gradient(90deg, var(--turquoise), var(--purple), var(--coral));
      z-index: 10;
    }

    .sponsor-slide {
      position: absolute;
      top: 1.5vh;
      left: 0;
      width: 100%;
      height: calc(100% - 1.5vh);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateX(100%);
      transition: opacity 0.8s ease, transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
      padding: 21vh 4.7vw 8.3vh 4.7vw;
      box-sizing: border-box;
    }

    .sponsor-slide.active {
      opacity: 1;
      transform: translateX(0);
    }
    
    .sponsor-slide.exit {
      opacity: 0;
      transform: translateX(-100%);
    }

    .sponsor-image-wrapper {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 5.5vh;
      max-height: 44vh;
    }

    .header-fixed {
      position: absolute;
      top: 7.7vh;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 3.1vw;
      font-weight: 900;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      z-index: 20;
      text-shadow: 0 2px 5px rgba(0,0,0,0.8);
    }

    .sponsor-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    }

    .sponsor-name {
      font-size: 5vw;
      font-weight: 900;
      color: #FFF;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      background: linear-gradient(90deg, var(--turquoise), #FFF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .sponsor-label {
      position: absolute;
      bottom: 4.4vh;
      right: 3.75vw;
      font-size: 2.8vw;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="sponsors-container" id="sponsors-container" style="display: none;">
    <!-- Slides will be injected here -->
    <div class="sponsor-label">AUSPICIANTE</div>
  </div>

  <script>
    const dataUrl = 'stream-data.json';
    let sponsors = [];
    let currentIndex = 0;
    let cycleInterval = null;
    let isPreviewMode = false;
    let pollIntervalId = null;

    async function fetchSponsors() {
      if (isPreviewMode) return;
      try {
        const response = await fetch(dataUrl + '?t=' + new Date().getTime());
        const data = await response.json();
        
        if (data.sponsors && Array.isArray(data.sponsors) && data.sponsors.length > 0) {
          const newSponsorsStr = JSON.stringify(data.sponsors);
          const oldSponsorsStr = JSON.stringify(sponsors);
          
          if (newSponsorsStr !== oldSponsorsStr) {
            sponsors = data.sponsors;
            renderSponsors();
          }
        } else {
          document.getElementById('sponsors-container').style.display = 'none';
          if(cycleInterval) clearInterval(cycleInterval);
          sponsors = [];
        }
      } catch (e) {
        console.error("Error fetching stream data:", e);
      }
    }

    function renderSponsors() {
      const container = document.getElementById('sponsors-container');
      container.innerHTML = `
        <div class="header-fixed">AUSPICIADOS POR</div>
      `;
      
      if (sponsors.length === 0) {
        container.style.display = 'none';
        return;
      }
      
      container.style.display = 'flex';
      
      sponsors.forEach((sponsor, index) => {
        const slide = document.createElement('div');
        slide.className = 'sponsor-slide' + (index === 0 ? ' active' : '');
        slide.id = 'sponsor-slide-' + index;
        
        slide.innerHTML = `
          <div class="sponsor-image-wrapper">
            <img src="sponsors/${sponsor.image}" class="sponsor-image" alt="${sponsor.name}">
          </div>
          <div class="sponsor-name">${sponsor.name}</div>
        `;
        container.appendChild(slide);
      });
      
      currentIndex = 0;
      
      if (cycleInterval) clearInterval(cycleInterval);
      if (sponsors.length > 1) {
        cycleInterval = setInterval(cycleNext, 10000); // Change every 10 seconds
      }
    }

    function cycleNext() {
      if (sponsors.length <= 1) return;
      
      const currentSlide = document.getElementById('sponsor-slide-' + currentIndex);
      if (currentSlide) {
        currentSlide.classList.remove('active');
        currentSlide.classList.add('exit');
        setTimeout(() => {
          if (currentSlide) currentSlide.classList.remove('exit');
        }, 1200);
      }
      
      currentIndex = (currentIndex + 1) % sponsors.length;
      
      const nextSlide = document.getElementById('sponsor-slide-' + currentIndex);
      if (nextSlide) nextSlide.classList.add('active');
    }

    // Initialize and poll
    fetchSponsors();
    pollIntervalId = setInterval(fetchSponsors, 3000);

    // Listen for preview updates from the control panel
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'previewSponsors') {
        isPreviewMode = true;
        if (pollIntervalId) clearInterval(pollIntervalId);
        
        const newSponsorsStr = JSON.stringify(event.data.sponsors || []);
        const oldSponsorsStr = JSON.stringify(sponsors);
        if (newSponsorsStr !== oldSponsorsStr) {
          sponsors = event.data.sponsors || [];
          renderSponsors();
        }
      }
    });
  </script>
</body>
</html>
