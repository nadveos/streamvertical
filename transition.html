<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Guta Flores — Transición Rápida (Stinger)</title>
  <link rel="stylesheet" href="transition.css">
</head>
<body>

  <div class="transition-overlay">

    <div class="stripe s1"></div>
    <div class="stripe s2"></div>
    <div class="stripe s3"></div>
    <div class="stripe s4"></div>
    <div class="stripe s5"></div>
    <div class="stripe s6"></div>
    <div class="stripe s7"></div>
    <div class="stripe s8"></div>
    <div class="stripe s9"></div>

    <div class="poncho-texture"></div>
    <div class="golden-line"></div>

    <div class="corner corner-tl">
      <svg viewBox="0 0 70 70"><path d="M4 66 L4 4 L66 4"/><path d="M4 20 L20 4"/><path d="M4 36 L36 4"/></svg>
    </div>
    <div class="corner corner-tr">
      <svg viewBox="0 0 70 70"><path d="M4 66 L4 4 L66 4"/><path d="M4 20 L20 4"/><path d="M4 36 L36 4"/></svg>
    </div>
    <div class="corner corner-bl">
      <svg viewBox="0 0 70 70"><path d="M4 66 L4 4 L66 4"/><path d="M4 20 L20 4"/><path d="M4 36 L36 4"/></svg>
    </div>
    <div class="corner corner-br">
      <svg viewBox="0 0 70 70"><path d="M4 66 L4 4 L66 4"/><path d="M4 20 L20 4"/><path d="M4 36 L36 4"/></svg>
    </div>

    <div class="center-logo">
      <div class="logo-brand" data-bind="host-name">GUTA FLORES</div>
      <div class="logo-divider"></div>
      <div class="logo-sub">🎙️ EN VIVO 🎙️</div>
      <div style="font-size: 16px; font-weight: 800; margin-top: 10px; letter-spacing: 2px; text-transform: uppercase;">
        <span style="color:#FFD700;" data-bind="motto-phrase1">DIFUNDIENDO ARTISTAS POCOS CONOCIDOS</span>
        <span style="color:#C0392B; margin: 0 6px;" data-bind="motto-connector">◆ Y ◆</span>
        <span style="color:#FFF;" data-bind="motto-phrase2">GUITARREAMOS A LA GORRA 🪕</span>
      </div>
    </div>

  </div>

  <script src="script-overlay.js"></script>
</body>
</html>
